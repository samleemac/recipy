<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Admin queue · Recipy</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    .queue-stats {
      display: flex; gap: 18px; margin-bottom: 22px;
      font: 500 13px var(--sans); color: var(--text-soft);
    }
    .queue-stats strong { color: var(--text); font: 700 22px var(--serif); }

    .pending-card {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: grid;
      grid-template-columns: 200px 1fr;
    }
    .pending-card .photo {
      background-size: cover; background-position: center;
      background-color: var(--border);
      min-height: 160px;
    }
    .pending-card .body { padding: 20px 24px; }
    .pending-card h3 {
      font: 700 22px var(--serif);
      margin: 0 0 4px;
    }
    .pending-card .meta {
      font: 400 12px var(--sans); color: var(--text-soft);
      margin-bottom: 12px;
    }
    .pending-card .intro {
      font: 400 14px/1.55 var(--sans);
      color: var(--text);
      margin-bottom: 12px;
    }
    .pending-summary {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      margin: 14px 0;
      font: 400 13px var(--sans); color: var(--text-soft);
    }
    .pending-summary div strong { color: var(--text); font-weight: 700; }
    .pending-actions {
      display: flex; gap: 10px; margin-top: 14px;
      flex-wrap: wrap;
    }
    .reject-row {
      display: flex; gap: 8px; margin-top: 12px;
      align-items: center;
      width: 100%;
    }
    .reject-row input { flex: 1; }
    @media (max-width: 740px) {
      .pending-card { grid-template-columns: 1fr; }
      .pending-card .photo { min-height: 200px; }
    }

    details.preview {
      background: var(--bg);
      border-radius: 12px;
      padding: 10px 14px;
      margin-top: 8px;
    }
    details.preview summary {
      font: 600 13px var(--sans);
      color: var(--text-soft);
      cursor: pointer;
    }
    details.preview pre {
      margin: 12px 0 0;
      font: 400 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--text);
      white-space: pre-wrap;
      max-height: 220px;
      overflow: auto;
    }
  </style>
</head>
<body data-page="admin">
  <div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>
  <div class="nav-wrap" id="navWrap"><div id="appNav"></div></div>

  <main class="app-container wide">
    <h1 class="page-title">Recipe approval queue</h1>
    <p class="page-sub">Admins only. Review what's been submitted, approve to publish, or reject with a reason.</p>

    <div id="adminRoot"><div class="empty-state"><span class="spinner"></span></div></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="app-shell.js"></script>
  <script>
    const $ = (s, r = document) => r.querySelector(s);
    const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }
    function timeAgo(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      const sec = (Date.now() - d.getTime()) / 1000;
      if (sec < 60) return "just now";
      if (sec < 3600) return Math.floor(sec / 60) + "m ago";
      if (sec < 86400) return Math.floor(sec / 3600) + "h ago";
      return Math.floor(sec / 86400) + "d ago";
    }

    function renderQueue(list) {
      const root = $("#adminRoot");
      if (!list.length) {
        root.innerHTML = `<div class="empty-state"><h3>Inbox zero.</h3><p>Nothing waiting for review.</p></div>`;
        return;
      }
      root.innerHTML = `
        <div class="queue-stats"><div><strong>${list.length}</strong><div>pending submission${list.length === 1 ? '' : 's'}</div></div></div>
        <div class="card-list">${list.map(r => `
          <article class="pending-card" data-id="${escapeHtml(r.id)}">
            <div class="photo" style="background-image:url(${escapeHtml((r.photo || '') + '?auto=format&fit=crop&w=600&q=72')})"></div>
            <div class="body">
              <h3>${escapeHtml(r.title)}</h3>
              <div class="meta">
                by <a href="profile.html?u=${encodeURIComponent(r.authorUsername || '')}"><strong>@${escapeHtml(r.authorUsername || 'unknown')}</strong></a>
                · ${timeAgo(r.publishedAt || r.createdAt)}
                · ${escapeHtml(r.cuisine || '—')}
                · ${r.time} min
              </div>
              <p class="intro">${escapeHtml(r.intro || '(no intro)')}</p>

              <div class="pending-summary">
                <div><strong>Tags:</strong> ${(r.tags || []).map(escapeHtml).join(", ") || "—"}</div>
                <div><strong>Equipment:</strong> ${(r.equipment || []).slice(0, 4).map(escapeHtml).join(", ") || "—"}</div>
                <div><strong>Ingredients:</strong> ${(r.ingredientGroups || []).reduce((n, g) => n + (g.items || []).length, 0)} items in ${(r.ingredientGroups || []).length} group(s)</div>
                <div><strong>Steps:</strong> ${(r.steps || []).length}</div>
              </div>

              <details class="preview">
                <summary>Show full ingredients + method</summary>
                <pre>${escapeHtml(formatPreview(r))}</pre>
              </details>

              <div class="pending-actions">
                <button class="btn btn-primary" data-action="approve" data-id="${escapeHtml(r.id)}">Approve &amp; publish</button>
                <button class="btn btn-danger"  data-action="rejectStart" data-id="${escapeHtml(r.id)}">Reject…</button>
              </div>
              <div class="reject-row" data-reject-for="${escapeHtml(r.id)}" hidden>
                <input class="form-input" type="text" placeholder="Why is this being rejected? (optional but encouraged)" />
                <button class="btn btn-danger" data-action="rejectConfirm" data-id="${escapeHtml(r.id)}">Reject</button>
                <button class="btn btn-ghost"  data-action="rejectCancel"  data-id="${escapeHtml(r.id)}">Cancel</button>
              </div>
            </div>
          </article>
        `).join("")}</div>
      `;
      $$("button[data-action]").forEach(b => b.addEventListener("click", handleAction));
    }

    function formatPreview(r) {
      const ings = (r.ingredientGroups || []).map(g => {
        const items = (g.items || []).map(it => `  • ${[it.amount, it.unit].filter(Boolean).join(" ")} ${it.text}`).join("\n");
        return `## ${g.name || "(unnamed group)"}\n${items}`;
      }).join("\n\n");
      const steps = (r.steps || []).map((s, i) => `${i + 1}. ${s.title || ""}${s.time ? ` (${s.time} min)` : ""}\n   ${s.desc || ""}${s.tip ? `\n   tip: ${s.tip}` : ""}`).join("\n\n");
      return `Slug: ${r.slug}\n\nINGREDIENTS\n${ings || "(none)"}\n\nMETHOD\n${steps || "(none)"}`;
    }

    async function handleAction(e) {
      const id = e.currentTarget.dataset.id;
      const action = e.currentTarget.dataset.action;
      const card = e.currentTarget.closest(".pending-card");
      if (action === "rejectStart") {
        card.querySelector(`[data-reject-for="${id}"]`).hidden = false;
        return;
      }
      if (action === "rejectCancel") {
        card.querySelector(`[data-reject-for="${id}"]`).hidden = true;
        return;
      }
      if (action === "approve") {
        e.currentTarget.disabled = true;
        try {
          await window.RECIPY.recipes.approve(id);
          card.style.opacity = "0.4";
          window.AppShell.toast("Approved & published");
          setTimeout(load, 600);
        } catch (err) {
          window.AppShell.toast(err.message || "Couldn't approve — check your admin role");
          e.currentTarget.disabled = false;
        }
        return;
      }
      if (action === "rejectConfirm") {
        const row = card.querySelector(`[data-reject-for="${id}"]`);
        const reason = row.querySelector("input").value.trim();
        e.currentTarget.disabled = true;
        try {
          await window.RECIPY.recipes.reject(id, reason);
          card.style.opacity = "0.4";
          window.AppShell.toast("Rejected — author will see your reason on their profile.");
          setTimeout(load, 600);
        } catch (err) {
          window.AppShell.toast(err.message || "Couldn't reject — check your admin role");
          e.currentTarget.disabled = false;
        }
        return;
      }
    }

    async function load() {
      const root = $("#adminRoot");
      root.innerHTML = `<div class="empty-state"><span class="spinner"></span></div>`;
      const list = await window.RECIPY.recipes.getPending();
      renderQueue(list);
    }

    window.AppShell.onAuth(async (user, profile) => {
      const root = $("#adminRoot");
      if (!window.RECIPY || !window.RECIPY.configured) {
        root.innerHTML = `<div class="empty-state"><h3>Admin queue needs Supabase.</h3><p>Set up your project in <code>config.js</code> first.</p></div>`;
        return;
      }
      if (!user) {
        root.innerHTML = `<div class="empty-state"><h3>Admins only.</h3><p>Sign in with an admin account to review submissions.</p><button class="btn btn-primary" id="goSignIn" style="margin-top:12px">Sign in</button></div>`;
        $("#goSignIn").addEventListener("click", () => window.AppShell.openAuthModal("signin"));
        return;
      }
      if (!profile || profile.role !== "admin") {
        root.innerHTML = `<div class="empty-state"><h3>Admins only.</h3><p>This page is gated by <code>profiles.role = 'admin'</code>. Ask the owner to promote you.</p></div>`;
        return;
      }
      load();
    });
  </script>
</body>
</html>
