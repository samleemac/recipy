<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Cookery School · Recipy</title>
  <meta name="description" content="A Recipy Cookery School technique guide — methods, seasoning ideas, top tips and troubleshooting." />
  <meta name="theme-color" content="#B4B56B" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    body {
      transition: background-color .35s var(--easing), color .35s var(--easing);
    }
    /* Paper grain to match index/recipe pages */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.5;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.09  0 0 0 0 0.03  0 0 0 0 0.02  0 0 0 0.5 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/></svg>");
      mix-blend-mode: multiply;
    }
    [data-theme="dark"] body::before { mix-blend-mode: screen; opacity: .35; }
    main { position: relative; z-index: 2; }

    .t-container { max-width: 960px; margin: 0 auto; padding: 0 24px; }

    /* ============================================================
       Hero
       ============================================================ */
    .t-hero {
      max-width: 1080px;
      margin: 24px auto 0;
      padding: 0 24px;
    }
    .t-hero-media {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      aspect-ratio: 21/9;
      background: var(--bg-soft);
    }
    .t-hero-media img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .t-hero-media::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.05) 30%, rgba(0,0,0,0.62) 100%);
      pointer-events: none;
    }
    .t-hero-content {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 28px 32px;
      z-index: 2;
      color: #FAF6F0;
    }
    .t-hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font: 700 10px var(--sans);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: rgba(250, 246, 240, 0.16);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(250, 246, 240, 0.25);
      padding: 5px 12px;
      border-radius: 100px;
      margin-bottom: 12px;
    }
    .t-hero h1 {
      font: 700 clamp(30px, 5vw, 48px)/1.1 var(--serif);
      letter-spacing: -0.02em;
      margin: 0 0 8px;
      text-shadow: 0 2px 16px rgba(0,0,0,0.4);
    }
    .t-hero .t-sub {
      font: 400 15px/1.5 var(--sans);
      color: rgba(250, 246, 240, 0.88);
      max-width: 560px;
      margin: 0 0 16px;
    }
    .t-hero-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .t-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font: 600 11px var(--sans);
      padding: 5px 11px;
      border-radius: 100px;
      background: rgba(250, 246, 240, 0.92);
      color: var(--ink);
      backdrop-filter: blur(4px);
    }
    .t-chip svg { width: 11px; height: 11px; }

    /* ============================================================
       Sections
       ============================================================ */
    .t-section { padding: 56px 0 0; }
    .t-section-tag {
      display: inline-block;
      font: 700 10px var(--sans);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--sage-dark);
      margin-bottom: 10px;
    }
    [data-theme="dark"] .t-section-tag { color: var(--sage); }
    .t-section h2 {
      font: 600 clamp(26px, 4vw, 36px)/1.12 var(--serif);
      letter-spacing: -0.01em;
      margin: 0 0 20px;
    }

    /* ---- Intro + fact card ---- */
    .t-intro p {
      font: 400 17px/1.7 var(--sans);
      color: var(--text);
      max-width: 720px;
      margin: 0;
    }
    .t-intro p::first-letter {
      font: 700 3.2em/0.9 var(--serif);
      float: left;
      margin: 6px 10px 0 0;
      color: var(--sage-dark);
    }
    [data-theme="dark"] .t-intro p::first-letter { color: var(--sage); }
    .t-fact {
      max-width: 720px;
      margin: 36px 0 0;
      background: var(--sage-soft);
      border: 1px solid rgba(180, 181, 107, 0.30);
      border-left: 4px solid var(--sage);
      border-radius: var(--radius-md);
      padding: 22px 26px;
    }
    [data-theme="dark"] .t-fact {
      background: rgba(162, 164, 92, 0.12);
      border-color: rgba(162, 164, 92, 0.30);
      border-left-color: var(--sage);
    }
    .t-fact-tag {
      display: inline-block;
      font: 700 10px var(--sans);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--sage-dark);
      margin-bottom: 6px;
    }
    [data-theme="dark"] .t-fact-tag { color: var(--sage); }
    .t-fact p { font: italic 500 16px/1.55 var(--serif); margin: 0; color: var(--text); }

    /* ============================================================
       Method picker — pill tabs + swappable panels
       ============================================================ */
    .method-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      padding: 5px;
      border-radius: 22px;
      width: max-content;
      max-width: 100%;
      margin-bottom: 26px;
    }
    .method-tab {
      padding: 9px 16px;
      border-radius: 100px;
      font: 600 13px var(--sans);
      color: var(--text-soft);
      white-space: nowrap;
      transition: background .15s, color .15s;
    }
    .method-tab:hover { color: var(--text); }
    .method-tab.is-active { background: var(--sage); color: var(--ink); font-weight: 700; }
    [data-theme="dark"] .method-tab.is-active { color: #1E1B18; }

    .method-panel { display: none; }
    .method-panel.is-active { display: block; animation: panelIn .28s var(--easing) both; }
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .method-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .method-meta .stat {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font: 600 13px var(--sans);
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 100px;
    }
    .method-meta .stat svg { color: var(--sage-dark); flex: none; }
    [data-theme="dark"] .method-meta .stat svg { color: var(--sage); }
    .method-meta .stat span { color: var(--text-soft); font-weight: 500; }

    .method-steps {
      list-style: none;
      counter-reset: mstep;
      padding: 0;
      margin: 0 0 28px;
      max-width: 720px;
      display: grid;
      gap: 14px;
    }
    .method-steps li {
      counter-increment: mstep;
      position: relative;
      padding: 16px 18px 16px 58px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font: 400 15px/1.6 var(--sans);
      color: var(--text);
    }
    .method-steps li::before {
      content: counter(mstep);
      position: absolute;
      left: 16px; top: 16px;
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      background: var(--sage-soft);
      color: var(--sage-dark);
      border-radius: 50%;
      font: 700 13px var(--serif);
    }
    [data-theme="dark"] .method-steps li::before {
      background: rgba(162, 164, 92, 0.16);
      color: var(--sage);
    }

    /* ---- Doneness reference row ---- */
    .doneness-label {
      font: 700 11px var(--sans);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-soft);
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .doneness-label svg { color: var(--sage-dark); }
    [data-theme="dark"] .doneness-label svg { color: var(--sage); }
    .doneness-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      max-width: 720px;
      margin-bottom: 28px;
    }
    .doneness-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--sage);
      border-radius: var(--radius-md);
      padding: 14px 16px;
    }
    .doneness-card .d-label { font: 700 15px var(--serif); color: var(--text); }
    .doneness-card .d-time {
      display: inline-block;
      font: 700 11px var(--sans);
      color: var(--sage-dark);
      background: var(--sage-soft);
      padding: 3px 9px;
      border-radius: 100px;
      margin: 6px 0 8px;
    }
    [data-theme="dark"] .doneness-card .d-time {
      color: var(--sage);
      background: rgba(162, 164, 92, 0.16);
    }
    .doneness-card .d-cue { font: 400 13px/1.5 var(--sans); color: var(--text-soft); margin: 0; }

    /* ---- Warning callout (common mistake) ---- */
    .guide-warning {
      max-width: 720px;
      background: var(--warning-soft);
      border: 1px solid rgba(162, 107, 31, 0.22);
      border-left: 4px solid var(--warning);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .guide-warning svg { color: var(--warning); flex: none; margin-top: 2px; }
    .guide-warning strong {
      display: block;
      font: 700 11px var(--sans);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--warning);
      margin-bottom: 4px;
    }
    .guide-warning p { font: 400 14px/1.55 var(--sans); color: var(--text); margin: 0; }

    /* ============================================================
       Seasoning chip cloud
       ============================================================ */
    .season-cloud { display: flex; gap: 10px; flex-wrap: wrap; max-width: 780px; }
    .season-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font: 600 13px var(--sans);
      color: var(--ochre-dark);
      background: var(--ochre-soft);
      border: 1px solid rgba(190, 138, 87, 0.28);
      padding: 9px 16px;
      border-radius: 100px;
    }
    [data-theme="dark"] .season-chip {
      color: var(--ochre);
      background: rgba(212, 163, 115, 0.14);
    }
    .season-chip::before { content: "✦"; font-size: 10px; opacity: 0.7; }

    /* ============================================================
       Tools grid (mirrors recipe.html .r-equip)
       ============================================================ */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }
    .tool-card {
      display: flex; flex-direction: column; align-items: center;
      gap: 12px;
      padding: 22px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      transition: transform .2s var(--easing), border-color .2s var(--easing);
    }
    .tool-card:hover { transform: translateY(-2px); border-color: var(--sage); }
    .tool-card svg { color: var(--sage-dark); }
    [data-theme="dark"] .tool-card svg { color: var(--sage); }
    .tool-card span { font: 600 13px var(--sans); color: var(--text); text-align: center; }

    /* ============================================================
       Top tips
       ============================================================ */
    .tips-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-width: 720px;
      display: grid;
      gap: 12px;
    }
    .tips-list li {
      padding: 14px 18px;
      background: var(--sage-soft);
      border-left: 3px solid var(--sage);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      font: italic 500 15px/1.55 var(--serif);
      color: var(--text);
    }
    [data-theme="dark"] .tips-list li { background: rgba(162, 164, 92, 0.12); }

    /* ============================================================
       FAQ accordion (troubleshooting)
       ============================================================ */
    .guide-faq { max-width: 720px; display: grid; gap: 10px; }
    .guide-faq details {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: border-color .2s;
    }
    .guide-faq details[open] { border-color: var(--sage); }
    .guide-faq summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 20px;
      cursor: pointer;
      font: 600 15px var(--sans);
      color: var(--text);
      list-style: none;
      user-select: none;
    }
    .guide-faq summary::-webkit-details-marker { display: none; }
    .guide-faq summary:hover { color: var(--sage-dark); }
    [data-theme="dark"] .guide-faq summary:hover { color: var(--sage); }
    .guide-faq summary .faq-chevron {
      flex: none;
      color: var(--text-soft);
      transition: transform .25s var(--easing);
    }
    .guide-faq details[open] summary .faq-chevron { transform: rotate(180deg); color: var(--sage-dark); }
    .guide-faq .faq-answer {
      padding: 0 20px 18px;
      border-top: 1px dashed var(--border);
      margin: 0 0 0;
    }
    .guide-faq .faq-answer p {
      font: 400 14px/1.65 var(--sans);
      color: var(--text-soft);
      margin: 14px 0 0;
    }

    /* ============================================================
       Related recipes
       ============================================================ */
    .related-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }
    .related-card {
      display: block;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: transform .2s var(--easing), box-shadow .2s var(--easing), border-color .2s;
    }
    .related-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(46, 42, 37, 0.12);
      border-color: var(--sage);
      color: inherit;
    }
    [data-theme="dark"] .related-card:hover { box-shadow: 0 12px 32px rgba(0,0,0,0.45); }
    .related-card-img {
      width: 100%;
      aspect-ratio: 4/3;
      background-size: cover;
      background-position: center;
      background-color: var(--bg-soft);
    }
    .related-card-body { padding: 12px 14px 14px; }
    .related-card-title { font: 700 15px/1.25 var(--sans); color: var(--text); margin: 0; }
    .related-card-meta { font: 400 12px var(--sans); color: var(--text-soft); margin-top: 4px; }
    .related-empty { font: 400 14px var(--sans); color: var(--text-soft); }

    /* ---- Back to school strip ---- */
    .t-backstrip {
      margin: 72px 0 0;
      padding: 36px 0 80px;
      text-align: center;
    }
    .t-backstrip a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 26px;
      font: 700 14px var(--sans);
      color: var(--white);
      background: var(--ochre);
      border-radius: 100px;
      transition: background .2s, transform .2s;
    }
    .t-backstrip a:hover { background: var(--ochre-dark); color: var(--white); transform: translateY(-2px); }

    /* ---- Not found state ---- */
    .t-notfound { text-align: center; padding: 100px 24px; }
    .t-notfound h1 { font: 700 34px var(--serif); margin: 0 0 10px; }
    .t-notfound p { color: var(--text-soft); margin: 0 0 24px; }

    /* ---- Footer (minimal, mirrors recipe.html) ---- */
    footer {
      margin-top: 0;
      padding: 28px 24px;
      background: var(--bg-soft);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font: 400 13px var(--sans);
      color: var(--text-soft);
      position: relative;
      z-index: 2;
    }
    footer .logo { font-size: 18px; color: var(--text); }
    footer a { color: var(--text-soft); margin-left: 12px; }
    footer a:hover { color: var(--green-dark); }

    @media (max-width: 640px) {
      .t-hero { margin-top: 12px; padding: 0 16px; }
      .t-hero-media { aspect-ratio: 4/3; }
      .t-hero-content { padding: 18px 20px; }
      .t-container { padding: 0 20px; }
      .t-section { padding: 44px 0 0; }
      .method-tabs { width: 100%; overflow-x: auto; flex-wrap: nowrap; border-radius: 16px; }
      .method-steps li { padding: 14px 16px 14px 52px; }
    }
  </style>
</head>
<body data-page="technique">
  <div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>
  <div class="nav-wrap" id="navWrap"><div id="appNav"></div></div>

  <main id="guideRoot">
    <div class="t-notfound" id="loadingState"><span class="spinner"></span></div>
  </main>

  <footer>
    <div class="logo">RECIPY<span class="logo-dot" aria-hidden="true"></span></div>
    <div>&copy; Recipy 2026 · <a href="learn.html">Cookery School</a> <a href="index.html">All recipes</a></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="techniques-data.js"></script>
  <script src="recipes-data.js"></script>
  <script src="supabase-client.js"></script>
  <script src="app-shell.js"></script>
  <script>
    const $ = (s, r = document) => r.querySelector(s);
    const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

    function escapeHtml(s) {
      return String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }

    const slug = new URLSearchParams(location.search).get("slug") || "";
    const guide = (window.TECHNIQUES || []).find(t => t.slug === slug);

    /* Generic tool icons cycled through the tools grid */
    const TOOL_ICONS = [
      '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v18H3z" opacity="0"/><path d="M12 2a7 7 0 0 1 7 7c0 2.4-1.2 4.5-3 5.7V21H8v-6.3C6.2 13.5 5 11.4 5 9a7 7 0 0 1 7-7z"/></svg>',
      '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>',
      '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16l-1.5 12a2 2 0 0 1-2 1.8h-9A2 2 0 0 1 5.5 20z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg>',
      '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
      '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v10a3 3 0 0 0 3 3h0a3 3 0 0 0 3-3V3"/><path d="M9 21v-5"/><path d="M18 3c-1.5 2-2 4.5-2 7 0 2 .7 3.5 2 4v7"/></svg>',
      '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M8 6V4h8v2"/></svg>'
    ];

    function renderNotFound() {
      $("#guideRoot").innerHTML = `
        <div class="t-notfound">
          <h1>Guide not found</h1>
          <p>We couldn't find that technique guide — it may still be simmering.</p>
          <a class="btn btn-primary" href="learn.html">Back to the Cookery School</a>
        </div>`;
    }

    function renderGuide() {
      document.title = `${guide.title} · Cookery School · Recipy`;
      if (window.AppShell && window.AppShell.setRecipeTitle) window.AppShell.setRecipeTitle(guide.title);

      const heroChips = `
        <span class="t-chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
          ${escapeHtml(guide.skillLevel)}
        </span>
        <span class="t-chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          ${guide.readTime} min read
        </span>
        ${guide.tags.map(t => `<span class="t-chip">${escapeHtml(t)}</span>`).join("")}
      `;

      const methodTabs = guide.methods.map((m, i) => `
        <button class="method-tab ${i === 0 ? "is-active" : ""}" role="tab" aria-selected="${i === 0}" data-method="${escapeHtml(m.key)}" type="button">${escapeHtml(m.label)}</button>
      `).join("");

      const methodPanels = guide.methods.map((m, i) => `
        <div class="method-panel ${i === 0 ? "is-active" : ""}" role="tabpanel" data-method="${escapeHtml(m.key)}" ${i === 0 ? "" : "hidden"}>
          <div class="method-meta">
            <span class="stat">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>
              <span>Heat</span> ${escapeHtml(m.heat)}
            </span>
            <span class="stat">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
              <span>Time</span> ${escapeHtml(m.time)}
            </span>
          </div>

          <ol class="method-steps">
            ${m.steps.map(s => `<li>${escapeHtml(s)}</li>`).join("")}
          </ol>

          <p class="doneness-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
            How to tell it's done
          </p>
          <div class="doneness-row">
            ${m.doneness.map(d => `
              <div class="doneness-card">
                <div class="d-label">${escapeHtml(d.label)}</div>
                <span class="d-time">${escapeHtml(d.time)}</span>
                <p class="d-cue">${escapeHtml(d.cue)}</p>
              </div>
            `).join("")}
          </div>

          <div class="guide-warning">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            <div>
              <strong>Watch out for</strong>
              <p>${escapeHtml(m.commonMistake)}</p>
            </div>
          </div>
        </div>
      `).join("");

      $("#guideRoot").innerHTML = `
        <section class="t-hero">
          <div class="t-hero-media">
            <img src="${escapeHtml(guide.heroPhoto)}?auto=format&fit=crop&w=1400&q=75" alt="${escapeHtml(guide.title)}" />
            <div class="t-hero-content">
              <span class="t-hero-kicker">${escapeHtml(guide.icon || "")} Cookery School</span>
              <h1>${escapeHtml(guide.title)}</h1>
              <p class="t-sub">${escapeHtml(guide.subtitle)}</p>
              <div class="t-hero-chips">${heroChips}</div>
            </div>
          </div>
        </section>

        <div class="t-container">
          <section class="t-section t-intro">
            <span class="t-section-tag">The basics</span>
            <p>${escapeHtml(guide.intro)}</p>
            <div class="t-fact">
              <span class="t-fact-tag">${escapeHtml(guide.fact.title)}</span>
              <p>${escapeHtml(guide.fact.body)}</p>
            </div>
          </section>

          <section class="t-section" id="methods">
            <span class="t-section-tag">Pick a method</span>
            <h2>The ways to cook it</h2>
            <div class="method-tabs" role="tablist" aria-label="Cooking methods">${methodTabs}</div>
            ${methodPanels}
          </section>

          <section class="t-section" id="seasoning">
            <span class="t-section-tag">Make it interesting</span>
            <h2>Seasoning &amp; flavour ideas</h2>
            <div class="season-cloud">
              ${guide.seasoningIdeas.map(s => `<span class="season-chip">${escapeHtml(s)}</span>`).join("")}
            </div>
          </section>

          <section class="t-section" id="tools">
            <span class="t-section-tag">What you'll need</span>
            <h2>Tools</h2>
            <div class="tools-grid">
              ${guide.toolsNeeded.map((t, i) => `<div class="tool-card">${TOOL_ICONS[i % TOOL_ICONS.length]}<span>${escapeHtml(t)}</span></div>`).join("")}
            </div>
          </section>

          <section class="t-section" id="tips">
            <span class="t-section-tag">From the kitchen</span>
            <h2>Top tips</h2>
            <ul class="tips-list">
              ${guide.topTips.map(t => `<li>${escapeHtml(t)}</li>`).join("")}
            </ul>
          </section>

          <section class="t-section" id="troubleshooting">
            <span class="t-section-tag">When it goes wrong</span>
            <h2>Troubleshooting</h2>
            <div class="guide-faq">
              ${guide.troubleshooting.map(f => `
                <details>
                  <summary>
                    ${escapeHtml(f.q)}
                    <svg class="faq-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
                  </summary>
                  <div class="faq-answer"><p>${escapeHtml(f.a)}</p></div>
                </details>
              `).join("")}
            </div>
          </section>

          <section class="t-section" id="related">
            <span class="t-section-tag">Put it into practice</span>
            <h2>Recipes that use this</h2>
            <div class="related-grid" id="relatedGrid"><span class="spinner"></span></div>
          </section>

          <div class="t-backstrip">
            <a href="learn.html">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
              Back to the Cookery School
            </a>
          </div>
        </div>
      `;

      bindMethodTabs();
      loadRelatedRecipes();
    }

    function bindMethodTabs() {
      const tabs = $$(".method-tab");
      const panels = $$(".method-panel");
      function activate(tab) {
        const key = tab.dataset.method;
        tabs.forEach(t => {
          const active = t === tab;
          t.classList.toggle("is-active", active);
          t.setAttribute("aria-selected", active ? "true" : "false");
        });
        panels.forEach(p => {
          const active = p.dataset.method === key;
          p.classList.toggle("is-active", active);
          p.hidden = !active;
        });
      }
      tabs.forEach((tab, i) => {
        tab.addEventListener("click", () => activate(tab));
        tab.addEventListener("keydown", (e) => {
          if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
          e.preventDefault();
          const next = tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length];
          next.focus();
          activate(next);
        });
      });
    }

    /* ----- Related recipes: match keywords against tags, title and ingredient text ----- */
    function recipeMatchesGuide(recipe, keywords) {
      const haystackParts = [
        recipe.title || "",
        (recipe.tags || []).join(" "),
      ];
      (recipe.ingredientGroups || []).forEach(g => {
        (g.items || []).forEach(it => haystackParts.push(it.text || ""));
      });
      const haystack = haystackParts.join(" ").toLowerCase();
      return keywords.some(k => haystack.includes(k.toLowerCase()));
    }

    async function loadRelatedRecipes() {
      const grid = $("#relatedGrid");
      let recipes = [];
      try {
        recipes = window.RECIPY && window.RECIPY.recipes
          ? await window.RECIPY.recipes.getAll()
          : (window.RECIPES || []);
      } catch (_) {
        recipes = window.RECIPES || [];
      }

      const matches = recipes
        .filter(r => recipeMatchesGuide(r, guide.relatedIngredientKeywords))
        .slice(0, 4);

      if (!matches.length) {
        grid.innerHTML = `<p class="related-empty">No matching recipes yet — <a href="index.html" style="color:var(--sage-dark);font-weight:600">browse the full library</a>.</p>`;
        return;
      }

      grid.innerHTML = matches.map(r => {
        const photo = r.photo ? `${r.photo}?auto=format&fit=crop&w=600&q=72` : "";
        const href = r.slug ? `recipe.html?slug=${encodeURIComponent(r.slug)}` : "index.html";
        return `
          <a class="related-card" href="${href}">
            <div class="related-card-img" style="${photo ? `background-image:url(${escapeHtml(photo)})` : ""}"></div>
            <div class="related-card-body">
              <p class="related-card-title">${escapeHtml(r.title)}</p>
              <p class="related-card-meta">${r.time} min · ${escapeHtml(r.cuisine || "")}</p>
            </div>
          </a>
        `;
      }).join("");
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (!guide) { renderNotFound(); return; }
      renderGuide();
    });
  </script>
</body>
</html>
