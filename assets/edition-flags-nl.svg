<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="nlRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d43845"/>
      <stop offset="45%" stop-color="#AE1C28"/>
      <stop offset="100%" stop-color="#7a1420"/>
    </linearGradient>
    <linearGradient id="nlWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </linearGradient>
    <linearGradient id="nlBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d5f9e"/>
      <stop offset="45%" stop-color="#21468B"/>
      <stop offset="100%" stop-color="#152d5c"/>
    </linearGradient>
    <filter id="flagShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#1a1020" flood-opacity="0.45"/>
    </filter>
    <filter id="fabric" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.04" numOctaves="2" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="multiply" result="blend"/>
      <feComponentTransfer in="blend">
        <feFuncA type="linear" slope="0.12"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- ~220px wide, strong wave -->
  <g transform="translate(24 36) rotate(-14)" filter="url(#flagShadow)">
    <g filter="url(#fabric)">
      <path fill="url(#nlRed)" d="M 6 14 C 55 2 110 22 165 8 L 218 18 C 165 32 110 10 55 26 L 6 22 Z"/>
      <path fill="url(#nlWhite)" d="M 6 22 C 55 26 110 6 165 20 L 218 30 C 165 44 110 24 55 40 L 6 36 Z"/>
      <path fill="url(#nlBlue)" d="M 6 36 C 55 40 110 20 165 34 L 218 44 C 165 58 110 38 55 54 L 6 50 Z"/>
      <path fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1.2" d="M 6 14 C 55 2 110 22 165 8 L 218 18"/>
      <path fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="0.8" d="M 55 26 L 165 20"/>
    </g>
  </g>

  <!-- ~160px, gentle ripple -->
  <g transform="translate(420 52) rotate(11)" filter="url(#flagShadow)">
    <g filter="url(#fabric)">
      <path fill="url(#nlRed)" d="M 4 10 C 38 4 78 14 118 6 L 158 12 C 118 20 78 8 38 18 L 4 16 Z"/>
      <path fill="url(#nlWhite)" d="M 4 16 C 38 18 78 6 118 14 L 158 20 C 118 28 78 16 38 26 L 4 24 Z"/>
      <path fill="url(#nlBlue)" d="M 4 24 C 38 26 78 14 118 22 L 158 28 C 118 36 78 24 38 34 L 4 32 Z"/>
    </g>
  </g>

  <!-- ~95px small flutter -->
  <g transform="translate(520 280) rotate(-22)" filter="url(#flagShadow)">
    <g filter="url(#fabric)">
      <path fill="url(#nlRed)" d="M 3 6 C 22 2 48 10 72 4 L 92 8 C 72 14 48 4 22 12 L 3 10 Z"/>
      <path fill="url(#nlWhite)" d="M 3 10 C 22 12 48 2 72 8 L 92 12 C 72 18 48 8 22 16 L 3 14 Z"/>
      <path fill="url(#nlBlue)" d="M 3 14 C 22 16 48 6 72 12 L 92 16 C 72 22 48 12 22 20 L 3 18 Z"/>
    </g>
  </g>

  <!-- ~185px, deep folds -->
  <g transform="translate(48 320) rotate(6)" filter="url(#flagShadow)">
    <g filter="url(#fabric)">
      <path fill="url(#nlRed)" d="M 5 12 C 48 0 95 20 142 6 L 188 16 C 142 30 95 8 48 24 L 5 20 Z"/>
      <path fill="url(#nlWhite)" d="M 5 20 C 48 24 95 2 142 16 L 188 26 C 142 40 95 18 48 34 L 5 30 Z"/>
      <path fill="url(#nlBlue)" d="M 5 30 C 48 34 95 12 142 26 L 188 36 C 142 50 95 28 48 44 L 5 40 Z"/>
      <path fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1" d="M 48 24 L 142 16"/>
    </g>
  </g>

  <!-- ~130px -->
  <g transform="translate(380 400) rotate(-8)" filter="url(#flagShadow)">
    <g filter="url(#fabric)">
      <path fill="url(#nlRed)" d="M 4 8 C 32 2 68 12 98 4 L 128 10 C 98 16 68 6 32 14 L 4 12 Z"/>
      <path fill="url(#nlWhite)" d="M 4 12 C 32 14 68 4 98 10 L 128 16 C 98 22 68 12 32 20 L 4 18 Z"/>
      <path fill="url(#nlBlue)" d="M 4 18 C 32 20 68 10 98 16 L 128 22 C 98 28 68 18 32 26 L 4 24 Z"/>
    </g>
  </g>

  <!-- ~70px tiny -->
  <g transform="translate(620 120) rotate(19)" filter="url(#flagShadow)">
    <g filter="url(#fabric)">
      <path fill="url(#nlRed)" d="M 2 4 C 14 1 32 6 48 2 L 62 5 C 48 9 32 3 14 8 L 2 6 Z"/>
      <path fill="url(#nlWhite)" d="M 2 6 C 14 8 32 2 48 6 L 62 9 C 48 13 32 7 14 12 L 2 10 Z"/>
      <path fill="url(#nlBlue)" d="M 2 10 C 14 12 32 6 48 10 L 62 13 C 48 17 32 11 14 16 L 2 14 Z"/>
    </g>
  </g>

  <!-- ~240px hero flag -->
  <g transform="translate(280 520) rotate(-5)" filter="url(#flagShadow)">
    <g filter="url(#fabric)">
      <path fill="url(#nlRed)" d="M 8 16 C 62 0 125 26 188 10 L 238 22 C 188 38 125 12 62 32 L 8 26 Z"/>
      <path fill="url(#nlWhite)" d="M 8 26 C 62 32 125 6 188 22 L 238 34 C 188 50 125 24 62 44 L 8 38 Z"/>
      <path fill="url(#nlBlue)" d="M 8 38 C 62 44 125 18 188 34 L 238 46 C 188 62 125 36 62 56 L 8 50 Z"/>
      <path fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="1.5" d="M 8 16 L 238 22"/>
      <path fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" d="M 62 32 L 188 22"/>
    </g>
  </g>

  <!-- ~110px mid scatter -->
  <g transform="translate(600 520) rotate(15)" filter="url(#flagShadow)">
    <g filter="url(#fabric)">
      <path fill="url(#nlRed)" d="M 3 7 C 28 2 58 11 82 5 L 108 9 C 82 15 58 5 28 13 L 3 11 Z"/>
      <path fill="url(#nlWhite)" d="M 3 11 C 28 13 58 3 82 9 L 108 13 C 82 19 58 9 28 17 L 3 15 Z"/>
      <path fill="url(#nlBlue)" d="M 3 15 C 28 17 58 7 82 13 L 108 17 C 82 23 58 13 28 21 L 3 19 Z"/>
    </g>
  </g>

  <!-- ~150px offset wave -->
  <g transform="translate(140 580) rotate(-18)" filter="url(#flagShadow)">
    <g filter="url(#fabric)">
      <path fill="url(#nlRed)" d="M 4 9 C 42 1 88 15 128 5 L 152 11 C 128 19 88 7 42 17 L 4 15 Z"/>
      <path fill="url(#nlWhite)" d="M 4 15 C 42 17 88 5 128 13 L 152 19 C 128 27 88 15 42 25 L 4 23 Z"/>
      <path fill="url(#nlBlue)" d="M 4 23 C 42 25 88 13 128 21 L 152 27 C 128 35 88 23 42 33 L 4 31 Z"/>
    </g>
  </g>
</svg>
